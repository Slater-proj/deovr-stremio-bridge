name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release (tests + exe portable + publication)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: La version du tag correspond à package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json $V"; exit 1; }
      - name: ffmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - run: npm run check
      - run: npm test
      - name: Dossier de ffmpeg à embarquer
        shell: pwsh
        run: |
          $f = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $f -or -not (Test-Path (Join-Path $f.DirectoryName 'ffprobe.exe'))) { throw "ffmpeg.exe / ffprobe.exe introuvables" }
          "FFMPEG_DIR=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exe portable
        run: node scripts/build-exe.js --ffmpeg-dir "$FFMPEG_DIR"
      - name: Test de fumée de l'exe (release puis debug)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\DeoVR-Stremio-Bridge-v*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\portable"
          node scripts/smoke-exe.js "$env:RUNNER_TEMP\portable\DeoVR-Stremio-Bridge"
          $zip = Get-ChildItem dist\DeoVR-Stremio-Bridge-v*-windows-x64-debug.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\portable-debug"
          node scripts/smoke-exe.js "$env:RUNNER_TEMP\portable-debug\DeoVR-Stremio-Bridge"
      - name: Notes de la release (extrait du CHANGELOG)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## \[/ { p = (index($0, "[" v "]") > 0); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Voir CHANGELOG.md." > notes.md
          {
            echo
            echo "---"
            echo "**Installation** : téléchargez **\`DeoVR-Stremio-Bridge-${GITHUB_REF_NAME}-windows-x64.zip\`**, décompressez-le où vous voulez, lancez \`DeoVR-Stremio-Bridge.exe\` (Stremio doit tourner). Aucune installation : Node.js et ffmpeg sont inclus, les réglages sont dans \`config.json\` créé à côté de l'exe, tout le reste dans \`data\\\`. Lisez \`docs\\GUIDE-RAPIDE.txt\`."
            echo
            echo "L'archive \`…-debug.zip\` est le même exe avec en plus le dossier \`utility\\\` (mode développeur, rapport d'assistance) : à prendre pour aider à déboguer."
          } >> notes.md
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "DeoVR ⇄ Stremio Bridge ${GITHUB_REF_NAME}" --notes-file notes.md
