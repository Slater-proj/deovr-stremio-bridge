name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows = la seule plateforme visée (DeoVR PC). Une seule version de Node : la 24 (LTS), celle qu'installe INSTALL.bat.
  tests:
    name: Tests (Windows, Node 24)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Vérifications statiques
        run: npm run check
      - name: Tests unitaires et d'intégration
        run: npm test

  # En parallèle (n'allonge pas la durée) : fabrication du zip et contrôle de son contenu.
  archive:
    name: Archive de release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run build
      - name: Contrôle du contenu de l'archive
        run: |
          unzip -tq dist/*.zip
          if unzip -l dist/*.zip | grep -E 'config\.json$|\.log$|diagnostic-report|rapport-support|bridge-state'; then echo "fichier local dans l'archive" && exit 1; fi
          unzip -p dist/*.zip 'deovr-stremio-bridge/start.bat' | file - | grep -q CRLF
