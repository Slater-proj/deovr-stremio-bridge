name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows = la seule plateforme visée (DeoVR PC). Une seule version de Node : la 24 (LTS).
  # Ce job teste le code, FABRIQUE L'EXE PORTABLE, puis lance cet exe pour de vrai (test de fumée) avant de le publier comme artefact.
  windows:
    name: Tests + exe portable (Windows, Node 24)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BUILD_SUFFIX: -dev.${{ github.run_number }}.${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Vérifications statiques
        run: npm run check
      - name: Tests unitaires et d'intégration
        run: npm test
      - name: Dossier de ffmpeg à embarquer
        shell: pwsh
        run: |
          $f = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $f -or -not (Test-Path (Join-Path $f.DirectoryName 'ffprobe.exe'))) { throw "ffmpeg.exe / ffprobe.exe introuvables" }
          "FFMPEG_DIR=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $f.FullName -version | Select-Object -First 1
      - name: Suffixe de build court
        shell: bash
        run: echo "BUILD_SUFFIX=-dev.${{ github.run_number }}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Fabriquer l'exe portable
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}      # facultatif : certificat de signature de code (voir docs/MAINTAINING.md) ; absent = exe non signé
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: node scripts/build-exe.js --ffmpeg-dir "$env:FFMPEG_DIR"
      - name: "Test de fumée de l'exe RELEASE (zip minimal : exe + resources + docs)"
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\DeoVR-Stremio-Bridge-v*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\portable"
          node scripts/smoke-exe.js "$env:RUNNER_TEMP\portable\DeoVR-Stremio-Bridge"
      - name: Test de fumée de l'exe DEBUG (même exe + utility\ + docs\DEBUG.txt)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\DeoVR-Stremio-Bridge-v*-windows-x64-debug.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\portable-debug"
          node scripts/smoke-exe.js "$env:RUNNER_TEMP\portable-debug\DeoVR-Stremio-Bridge"
      - name: Journaux du test de fumée (en cas d'échec)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\portable\DeoVR-Stremio-Bridge\data" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v7
        with:
          name: exe-portable-windows-${{ github.run_number }}
          path: dist/DeoVR-Stremio-Bridge-v*-windows-x64*.zip
          retention-days: 14
          if-no-files-found: error

  # En parallèle : variante « Node » (développeurs ; non publiée dans les releases) fabriquée et contrôlée.
  archive:
    name: Archive Node (variante avancée)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build (suffixe de test)
        run: BUILD_SUFFIX="-dev.${{ github.run_number }}.${GITHUB_SHA::7}" npm run build
      - name: Contrôle du contenu de l'archive
        run: |
          unzip -tq dist/*.zip
          if unzip -l dist/*.zip | grep -E 'config\.json$|\.log$|diagnostic-report|rapport-support|bridge-state|secrets\.dat'; then echo "fichier local dans l'archive" && exit 1; fi
          unzip -p dist/*.zip 'deovr-stremio-bridge/start.bat' | file - | grep -q CRLF
          unzip -p dist/*.zip 'deovr-stremio-bridge/BUILD-INFO.txt'

  # Uniquement sur main, uniquement si tout est vert : met à jour la pré-release « dev-build » (toujours le dernier build de test).
  dev-release:
    name: Pré-release dev-build
    needs: [windows, archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Récupérer l'exe portable fabriqué et testé par le job Windows
        run: gh run download "$GITHUB_RUN_ID" -n "exe-portable-windows-${{ github.run_number }}" -D dist
      - name: Publier la pré-release
        run: |
          ls -la dist
          gh release delete dev-build --cleanup-tag --yes || true
          {
            echo "**Build de test automatique** du dernier commit de \`main\` (${GITHUB_SHA::7}). Tests verts et exe vérifié par un test de fumée sous Windows, mais **non validé sur un vrai casque**."
            echo
            echo "- **\`DeoVR-Stremio-Bridge-…-windows-x64-debug.zip\`** : pour les essais. Contient l'exe, \`resources\\\`, \`docs\\\` et le dossier \`utility\\\` (mode développeur, rapport d'assistance, diagnostic…)."
            echo "- \`DeoVR-Stremio-Bridge-…-windows-x64.zip\` : le même exe, package minimal tel qu'il sera publié (exe + resources + docs)."
            echo
            echo "Dernier changement : ${COMMIT_MSG%%$'\n'*}"
            echo
            echo "Pour une version stable, prenez la dernière release (pas une pré-release)."
          } > notes.md
          gh release create dev-build dist/*.zip --prerelease --target "$GITHUB_SHA" --title "Build de test (main, ${GITHUB_SHA::7})" --notes-file notes.md
